# Testing configuration — token delay 0 for determinism; tests override
# RAG_DATABASE_URL to the rag_learning_test database.
app:
  name: rag-learning-platform
  environment: testing
  debug: true
  version: 0.1.0

database:
  url: postgresql+psycopg://rag:rag@localhost:5432/rag_learning_test

cors:
  origins:
    - http://localhost:5173

chat:
  provider: mock          # tests stay deterministic — real LLM turns are unit-tested via httpx mocks
  mock:
    token_delay_ms: 0

llm:
  provider: openrouter
  model: qwen/qwen3.8-27b:free
  api_key: ""