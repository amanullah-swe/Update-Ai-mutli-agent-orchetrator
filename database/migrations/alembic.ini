# Alembic configuration — database/migrations is the only DDL source (build decision #8).
# %(here)s = the directory containing this file, so relative paths work from any CWD.
[alembic]
script_location = %(here)s
path_separator = os
# URL comes from the app's Settings (see env.py); never hardcode here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S